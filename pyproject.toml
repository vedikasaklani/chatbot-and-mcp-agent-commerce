[project]
name = "agent-commerce-payout-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vedikasaklani", email = "ivedikasaklani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.2",
    "mcp[cli]>=2.1.1",
    "openai>=3.3.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "razorpay>=2.0.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
]

[project.scripts]
agent-commerce-payout-automation = "agent_commerce_payout_automation:main"

[dependency-groups]
dev = [
    "pylint>=3.3.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"