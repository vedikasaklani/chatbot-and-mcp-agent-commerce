<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== LOGIN SCREEN ===================== -->
  <main id="login-screen" class="screen login-screen">
    <form id="login-form" class="login-card" autocomplete="on">
      <h1 class="login-title">Sign in</h1>
      <p class="login-subtitle">Chat with the shop assistant to browse and buy.</p>

      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" id="login-email" name="username" required autocomplete="username" />
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="login-password" name="password" required autocomplete="current-password" />
      </label>

      <p id="login-error" class="error-text" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="login-submit">
        Sign in
      </button>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </form>
  </main>

  <!-- ===================== CHAT APP ===================== -->
  <div id="app-screen" class="screen app-screen" hidden>

    <header class="app-header">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Shop Assistant</span>
      </div>

      <div class="header-actions">
        <button id="cart-toggle" class="btn btn-ghost cart-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="cart-drawer">
          <span>Cart</span>
        </button>
        <button id="logout-btn" class="btn btn-ghost">Sign out</button>
      </div>
    </header>

    <div class="app-body">
      <!-- Chat column -->
      <section class="chat-column" aria-label="Conversation">
        <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions">
          <div class="msg msg-assistant">
            <div class="msg-bubble">
              Hi! I can help you find and buy products. What are you looking for today?
            </div>
          </div>
        </div>

        <form id="composer" class="composer">
          <label for="composer-input" class="sr-only">Message</label>
          <input
            id="composer-input"
            type="text"
            placeholder="Ask about a product, or say “buy 2 of…”"
            autocomplete="off"
          />
          <button type="submit" id="composer-send" class="btn btn-primary composer-send" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12l16-7-6 16-2.5-6.5L4 12z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </button>
        </form>
      </section>
    </div>

    <!-- Cart drawer -->
    <aside id="cart-drawer" class="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title" hidden>
      <div class="cart-drawer-header">
        <h2 id="cart-title">Your cart</h2>
        <button id="cart-close" class="btn btn-icon" aria-label="Close cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div id="cart-items" class="cart-items">
        <p class="cart-empty">Your cart is empty.</p>
      </div>

      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Total</span>
          <span id="cart-total">₹0.00</span>
        </div>
        <button id="cart-checkout" class="btn btn-primary btn-block" disabled>
          Checkout
        </button>
      </div>
    </aside>
    <div id="cart-backdrop" class="cart-backdrop" hidden></div>
  </div>

  <!-- Razorpay Checkout.js -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="app.js"></script>
</body>
</html>
